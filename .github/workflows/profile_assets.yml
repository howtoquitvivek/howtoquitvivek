name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      # ---------------- VALORANT ----------------
      - name: Generate Valorant data
        env:
          HENRIK_API_KEY: ${{ secrets.HENRIK_API_KEY }}
        run: |
          mkdir -p dist/valorant
          python generate_valorant_data.py
          mv valorant.json dist/valorant/valorant.json
          mv valorant-card.svg dist/valorant/valorant-card.svg

      # ---------------- SNAKE ----------------
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake/github-contribution-grid-snake.svg
            dist/snake/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ---------------- PUSH ----------------
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
